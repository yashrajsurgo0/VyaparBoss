# Render blueprint: render.com → New → Blueprint → pick this repo.
# FREE plan: the disk resets on every restart/redeploy. Set UPSTASH_REDIS_REST_URL and
# UPSTASH_REDIS_REST_TOKEN (free Upstash database, docs/DEPLOY.md) and data survives anyway.
# Or switch to a paid plan with a disk:
#   plan: starter
#   disk: { name: vyaparboss-data, mountPath: /var/data, sizeGB: 1 }
#   and set DATA_FILE to /var/data/db.json
services:
  - type: web
    name: vyaparboss
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_FILE
        value: ./data/db.json
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: PUBLIC_URL
        value: https://vyaparboss.onrender.com
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_API_KEY
        sync: false
      - key: OUTREACH_FROM_EMAIL
        sync: false
      - key: OUTREACH_DAILY_CAP
        value: "30"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CONTACT_TO
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
