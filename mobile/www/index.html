<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KaantaMandi</title>
<style>
  :root{--bg:#F8F4EC;--ink:#1F2340;--head:#2F3A9E;--accent:#F5A300}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box;text-align:center}
  h1{color:var(--head);font-size:22px;margin:16px 0 8px} p{margin:0 0 20px;max-width:320px}
  button{background:var(--head);color:#fff;border:0;border-radius:999px;padding:12px 28px;font:inherit;font-weight:600}
  svg{width:72px;height:72px}
</style></head>
<body><main>
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="30" width="44" height="5" rx="2" fill="#2F3A9E"/><rect x="29" y="34" width="6" height="22" fill="#2F3A9E"/><rect x="14" y="18" width="12" height="12" rx="2" fill="#2F3A9E"/><rect x="38" y="18" width="12" height="12" rx="2" fill="#F5A300"/></svg>
  <h1>No internet connection</h1>
  <p>KaantaMandi needs the internet to find suppliers and prices. Check your connection and try again.</p>
  <button id="retry">Try again</button>
</main>
<script src="offline.js"></script>
</body></html>
